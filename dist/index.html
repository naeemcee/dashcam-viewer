<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashcam GPS Viewer</title>

    <link rel="icon" href="/favicon.ico">

  <script type="module" crossorigin src="/assets/index-DY9-BJtJ.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BZpW97dX.css">
</head>

<body>

    <header id="header">
        <h2>🚗 Dashcam GPS Viewer</h2>
    </header>

    <div id="container">

        <!-- Sidebar -->
        <aside id="sidebar">

            <section class="panel">

                <h3>Load GPS Data</h3>

                <input
                    id="zipInput"
                    type="file"
                    accept=".zip">

            </section>

            <section class="panel">

                <h3>Trip Information</h3>

                <div id="tripInfo">

                    <p>No trip loaded.</p>

                </div>

            </section>

        </aside>

        <!-- Main Content -->
        <main id="main">

            <div id="map"></div>

            <div id="dashboard">

                <div id="statistics">

                    <h3>Statistics</h3>

                    <div id="statsContainer">

                        <p>Load a trip to see statistics.</p>

                    </div>

                </div>

            </div>

        </main>

    </div>


</body>
</html>
